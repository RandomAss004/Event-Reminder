<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Event Reminder — Web Edition</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --primary-soft: #EFF6FF;
    --primary-text: #1E40AF;
    --bg: #F8FAFC;
    --bg-elev: #FFFFFF;
    --bg-sunken: #F1F5F9;
    --text: #0F172A;
    --text-muted: #64748B;
    --border: #E2E8F0;
    --danger: #EF4444;
    --danger-soft: #FEE2E2;
    --warning: #F59E0B;
    --warning-soft: #FEF3C7;
    --success: #10B981;
    --success-soft: #D1FAE5;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
    --radius: 10px;
    --font: 'Inter', system-ui, -apple-system, sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --primary: #3B82F6;
    --primary-hover: #60A5FA;
    --primary-soft: #1E293B;
    --primary-text: #93C5FD;
    --bg: #0B1329;
    --bg-elev: #111E38;
    --bg-sunken: #0F172A;
    --text: #F8FAFC;
    --text-muted: #94A3B8;
    --border: #1E293B;
    --danger: #F87171;
    --danger-soft: #450A0A;
    --warning: #FBBF24;
    --warning-soft: #451A03;
    --success: #34D399;
    --success-soft: #064E3B;
    --shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
  #root { max-width: 1080px; margin: 0 auto; padding: 0 16px 60px; }
  a { color: var(--primary); text-decoration: none; }

  /* Header */
  .header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 0; border-bottom: 1px solid var(--border); margin-bottom: 20px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo { font-size: 1.8rem; }
  .brand h1 {
    font-size: 1.35rem; font-weight: 800; margin: 0;
    background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  [data-theme="dark"] .brand h1 {
    background: linear-gradient(135deg, #60A5FA 0%, #93C5FD 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

  select, input, textarea {
    font-family: var(--font); font-size: 0.9rem; color: var(--text);
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 12px; outline: none; transition: border-color .15s ease;
  }
  select:focus, input:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15); }
  
  button {
    font-family: var(--font); font-size: 0.88rem; font-weight: 600; cursor: pointer;
    border-radius: 8px; border: 1px solid transparent; padding: 8px 14px;
    background: var(--bg-sunken); color: var(--text); transition: all .15s ease;
  }
  button:hover { filter: brightness(0.96); }
  .btn-primary { background: var(--primary); color: white; border: none; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-outline { background: transparent; border: 1px solid var(--border); }
  .btn-outline:hover { background: var(--bg-sunken); }
  .btn-success { background: var(--success); color: white; border: none; }
  .btn-danger { background: var(--danger-soft); color: var(--danger); }
  .btn-sm { padding: 5px 9px; font-size: 0.8rem; border-radius: 6px; }

  /* Auth Card */
  .auth-card {
    max-width: 380px; margin: 50px auto; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: 14px; padding: 28px;
    box-shadow: var(--shadow); text-align: center;
  }
  .auth-tabs { display: flex; gap: 6px; background: var(--bg-sunken); padding: 4px; border-radius: 8px; margin-bottom: 20px; }
  .auth-tabs button { flex: 1; padding: 7px; background: transparent; border: none; border-radius: 6px; font-size: 0.88rem; }
  .auth-tabs button.active { background: var(--bg-elev); color: var(--primary); font-weight: 700; box-shadow: var(--shadow); }
  .auth-form { display: flex; flex-direction: column; gap: 12px; text-align: left; }
  .auth-form label { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); }

  /* Form Section */
  .card {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
    padding: 20px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .card-title { font-size: 1.05rem; font-weight: 700; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
  .form-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-bottom: 14px;
  }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.78rem; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.03em; }

  /* Filter Bar */
  .filter-bar {
    display: flex; gap: 10px; align-items: center; margin-bottom: 16px; flex-wrap: wrap;
  }
  .filter-bar input[type="search"] { flex: 1; min-width: 200px; }

  /* Event Rows */
  .event-item {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px; display: flex; align-items: center;
    justify-content: space-between; gap: 12px; flex-wrap: wrap; transition: transform .1s ease;
  }
  .event-item:hover { border-color: var(--primary); }
  .event-item.done { opacity: 0.65; background: var(--bg-sunken); }
  .event-info { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 240px; }
  .event-title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .event-title { font-size: 1rem; font-weight: 700; }
  .event-meta { font-size: 0.82rem; color: var(--text-muted); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 2px; }
  .event-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }

  /* Badges */
  .badge {
    font-size: 0.72rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
    display: inline-flex; align-items: center; gap: 4px;
  }
  .badge-cat { background: var(--primary-soft); color: var(--primary-text); }
  .badge-high { background: var(--danger-soft); color: var(--danger); }
  .badge-med { background: var(--warning-soft); color: var(--warning); }
  .badge-low { background: var(--success-soft); color: var(--success); }
  .badge-notice { background: #FEF3C7; color: #92400E; }
  [data-theme="dark"] .badge-notice { background: #451A03; color: #FCD34D; }

  /* Toasts */
  #toasts { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 8px; max-width: 340px; }
  .toast {
    background: var(--bg-elev); border: 1px solid var(--border); border-left: 4px solid var(--primary);
    border-radius: 8px; padding: 12px 14px; box-shadow: var(--shadow); font-size: 0.85rem;
  }

  /* Modals */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: none;
    align-items: center; justify-content: center; z-index: 90; padding: 16px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: var(--bg-elev); border: 1px solid var(--border); border-radius: 12px;
    max-width: 500px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 24px; box-shadow: var(--shadow);
  }
  .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-header h3 { margin: 0; font-size: 1.15rem; font-weight: 700; }
</style>
</head>
<body>
<div id="root"></div>
<div id="toasts"></div>

<script>
/* ==================== CONFIG & LOCALIZATION ==================== */
const CATEGORIES = [
  "👶 Baby Shower",
  "🎂 Birthday",
  "💍 Wedding",
  "💼 Meeting / Work",
  "🏥 Doctor / Health",
  "🎉 Party / Celebration",
  "🎓 Exam / Study",
  "✈️ Travel / Trip",
  "💳 Bill / Payment",
  "📌 General"
];

const REMIND_OFFSETS = [
  { label: "At event time", mins: 0 },
  { label: "5 minutes before", mins: 5 },
  { label: "10 minutes before", mins: 10 },
  { label: "15 minutes before", mins: 15 },
  { label: "30 minutes before", mins: 30 },
  { label: "1 hour before", mins: 60 },
  { label: "2 hours before", mins: 120 },
  { label: "3 hours before", mins: 180 },
  { label: "1 day before", mins: 1440 },
  { label: "2 days before", mins: 2880 }
];

const I18N = {
  English: {
    appTitle: "Event Reminder",
    tagline: "Smart alerts with automated WhatsApp",
    login: "Login", register: "Register",
    username: "Username", password: "Password",
    loginBtn: "Sign In", registerBtn: "Create Account",
    logout: "Logout",
    formTitleAdd: "➕ Add New Event", formTitleEdit: "✏️ Edit Event Details",
    eventName: "Event Name *", category: "Category *", date: "Date *", time: "Time (24h) *",
    location: "Location / Venue", remindBefore: "Remind Before",
    phone: "WhatsApp Phone (+CountryCode)", priority: "Priority", note: "Note / Description",
    addBtn: "Add Event ➕", saveBtn: "Save Changes ✏️", clearBtn: "Clear Form",
    searchPlaceholder: "🔍 Search events by name, location, date, or note...",
    weeklyStats: "📊 Weekly Activity", overview: "📋 Overview", about: "ℹ️ About",
    testAlert: "Test Alert", viewMap: "View Map", markDone: "Mark Done", edit: "Edit", delete: "Delete"
  },
  Hindi: {
    appTitle: "इवेंट रिमाइंडर",
    tagline: "स्मार्ट अलर्ट और ऑटोमैटिक व्हाट्सएप",
    login: "लॉगिन", register: "रजिस्टर",
    username: "उपयोगकर्ता नाम", password: "पासवर्ड",
    loginBtn: "साइन इन करें", registerBtn: "खाता बनाएं",
    logout: "लॉगआउट",
    formTitleAdd: "➕ नया इवेंट जोड़ें", formTitleEdit: "✏️ इवेंट संपादित करें",
    eventName: "इवेंट का नाम *", category: "श्रेणी *", date: "तारीख *", time: "समय (24h) *",
    location: "स्थान / वेन्यू", remindBefore: "पहले याद दिलाएं",
    phone: "व्हाट्सएप फोन (+कंट्री कोड)", priority: "प्राथमिकता", note: "विवरण / नोट",
    addBtn: "इवेंट जोड़ें ➕", saveBtn: "बदलाव सहेजें ✏️", clearBtn: "साफ़ करें",
    searchPlaceholder: "🔍 नाम, स्थान, तारीख या नोट से खोजें...",
    weeklyStats: "📊 साप्ताहिक चार्ट", overview: "📋 अवलोकन", about: "ℹ️ जानकारी",
    testAlert: "टेस्ट अलर्ट", viewMap: "मैप देखें", markDone: "पूर्ण", edit: "संपादित करें", delete: "हटाएं"
  },
  Marathi: {
    appTitle: "इव्हेंट रिमाइंडर",
    tagline: "स्मार्ट अलर्ट आणि स्वयंचलित व्हॉट्सअ‍ॅप",
    login: "लॉगिन", register: "नोंदणी",
    username: "वापरकर्ता नाव", password: "पासवर्ड",
    loginBtn: "साइन इन करा", registerBtn: "खाते तयार करा",
    logout: "लॉगआऊट",
    formTitleAdd: "➕ नवीन इव्हेंट जोडा", formTitleEdit: "✏️ इव्हेंट संपादित करा",
    eventName: "इव्हेंटचे नाव *", category: "श्रेणी *", date: "तारीख *", time: "वेळ (24h) *",
    location: "स्थान / ठिकाण", remindBefore: "आधी आठवण करा",
    phone: "व्हॉट्सअ‍ॅप फोन (+देश कोड)", priority: "प्राधान्य", note: "नोंद / माहिती",
    addBtn: "इव्हेंट जोडा ➕", saveBtn: "बदल जतन करा ✏️", clearBtn: "साफ करा",
    searchPlaceholder: "🔍 नाव, स्थान, तारीख किंवा माहितीने शोधा...",
    weeklyStats: "📊 साप्ताहिक आलेख", overview: "📋 आढावा", about: "ℹ️ माहिती",
    testAlert: "चाचणी अलर्ट", viewMap: "नकाशा पहा", markDone: "पूर्ण", edit: "संपादित करा", delete: "काढा"
  }
};

/* ==================== STATE MANAGEMENT ==================== */
let state = {
  lang: localStorage.getItem("er_lang") || "English",
  theme: localStorage.getItem("er_theme") || "dark",
  user: localStorage.getItem("er_user") || null,
  events: [],
  editingId: null,
  search: "",
  filterCategory: "All",
  filterPriority: "All",
  activeTab: "login"
};

document.documentElement.setAttribute("data-theme", state.theme);

function t(key) {
  return (I18N[state.lang] && I18N[state.lang][key]) || I18N.English[key] || key;
}

function loadEvents() {
  if (!state.user) { state.events = []; return; }
  try {
    const raw = localStorage.getItem(`er_events_${state.user}`);
    state.events = raw ? JSON.parse(raw) : [];
  } catch(e) { state.events = []; }
}

function saveEvents() {
  if (!state.user) return;
  localStorage.setItem(`er_events_${state.user}`, JSON.stringify(state.events));
}

function showToast(html, duration = 6000) {
  const container = document.getElementById("toasts");
  const toast = document.createElement("div");
  toast.className = "toast";
  toast.innerHTML = html;
  container.appendChild(toast);
  setTimeout(() => { toast.remove(); }, duration);
}

function speak(text) {
  try {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance(text);
      u.rate = 1.0;
      speechSynthesis.speak(u);
    }
  } catch(e) {}
}

/* ==================== AUTOMATED WHATSAPP (TWILIO / WA.ME) ==================== */
function sendWhatsapp(phone, message) {
  if (!phone) return;
  const cleanPhone = phone.trim().startsWith("+") ? phone.trim() : "+" + phone.trim();
  
  // Call Vercel serverless function (POST /api/send-whatsapp)
  fetch("/api/send-whatsapp", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ to: cleanPhone, message: message })
  })
  .then(res => {
    if (res.ok) {
      showToast(`✅ WhatsApp message sent automatically to <b>${cleanPhone}</b>`);
    } else {
      throw new Error("Vercel backend returned non-200");
    }
  })
  .catch(() => {
    // Fallback: wa.me instant link
    const waUrl = `https://wa.me/${cleanPhone.replace(/[^\d]/g, "")}?text=${encodeURIComponent(message)}`;
    showToast(`
      ⚠️ Automatic WhatsApp API not configured.<br>
      <a href="${waUrl}" target="_blank" class="btn-sm btn-primary" style="display:inline-block;margin-top:6px;">📲 Open WhatsApp to Send</a>
    `, 12000);
  });
}

function triggerAlert(ev) {
  const isAdvance = ev.remindBefore && ev.remindBefore !== "At event time";
  const timingDesc = isAdvance ? `in ${ev.remindBefore.replace(" before", "")}` : "NOW!";
  const mapsUrl = ev.location ? `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(ev.location)}` : "";

  // 1. Spoken Audio
  speak(`Reminder: ${ev.name} is happening ${timingDesc}!`);

  // 2. Browser OS Notification
  if ('Notification' in window && Notification.permission === "granted") {
    new Notification(`🗓️ Reminder: ${ev.name}`, {
      body: `${ev.category} • ${ev.date} ${ev.time}\n` + (ev.location ? `📍 ${ev.location}\n` : "") + `Alert: ${timingDesc}`
    });
  }

  // 3. WhatsApp Message
  if (ev.phone) {
    let waMsg = `🔔 *Event Reminder: ${ev.name}*\n`;
    waMsg += `⏰ *Happening ${timingDesc}*\n`;
    waMsg += `📂 Category: ${ev.category}\n`;
    waMsg += `📅 Date & Time: ${ev.date} ${ev.time}\n`;
    if (ev.location) {
      waMsg += `📍 Location: ${ev.location}\n`;
      waMsg += `🗺️ Maps: ${mapsUrl}\n`;
    }
    if (ev.note) waMsg += `📝 Note: ${ev.note}\n`;
    waMsg += `\n_Sent automatically by Event Reminder_`;
    sendWhatsapp(ev.phone, waMsg);
  }

  // 4. In-App Toast
  showToast(`
    <b>🔔 Reminder: ${ev.name} (${timingDesc})</b><br>
    📂 ${ev.category} • 📅 ${ev.date} ${ev.time}<br>
    ${ev.location ? `📍 ${ev.location} <a href="${mapsUrl}" target="_blank" style="margin-left:4px;font-weight:bold;">[Open Map]</a><br>` : ""}
    ${ev.phone ? `📱 Sent to WhatsApp (${ev.phone})` : ""}
  `, 10000);
}

/* ==================== BACKGROUND MONITOR LOOP ==================== */
function checkReminders() {
  if (!state.user || !state.events.length) return;
  const now = new Date();

  state.events.forEach(e => {
    if (e.done || e.notified) return;

    try {
      const eventDt = new Date(`${e.date}T${e.time}:00`);
      if (isNaN(eventDt.getTime())) return;

      const offsetEntry = REMIND_OFFSETS.find(o => o.label === e.remindBefore) || { mins: 0 };
      const triggerDt = new Date(eventDt.getTime() - offsetEntry.mins * 60000);

      const diffMs = triggerDt - now;
      if (diffMs <= 0 && diffMs > -60000) {
        e.notified = true;
        triggerAlert(e);
        saveEvents();
        render();
      }
    } catch(err) {}
  });
}
setInterval(checkReminders, 20000);

/* ==================== ACTIONS ==================== */
function handleAuth(type, username, password) {
  if (!username || !password) return alert("Please fill all credentials");
  let users = JSON.parse(localStorage.getItem("er_registered_users") || "{}");

  if (type === "register") {
    if (users[username]) return alert("Username already exists!");
    users[username] = password;
    localStorage.setItem("er_registered_users", JSON.stringify(users));
    state.user = username;
    localStorage.setItem("er_user", username);
    loadEvents();
    render();
  } else {
    if (!users[username] || users[username] !== password) {
      return alert("Invalid username or password");
    }
    state.user = username;
    localStorage.setItem("er_user", username);
    loadEvents();
    render();
  }
}

function handleSaveEvent(e) {
  e.preventDefault();
  const form = e.target;
  const name = form.name.value.trim();
  const category = form.category.value;
  const date = form.date.value;
  const time = form.time.value;
  const location = form.location.value.trim();
  const remindBefore = form.remindBefore.value;
  const phone = form.phone.value.trim();
  const priority = form.priority.value;
  const note = form.note.value.trim();

  if (!name || !date || !time) return alert("Please fill Event Name, Date, and Time.");

  if (state.editingId) {
    const idx = state.events.findIndex(x => x.id === state.editingId);
    if (idx !== -1) {
      state.events[idx] = { ...state.events[idx], name, category, date, time, location, remindBefore, phone, priority, note, done: false, notified: false };
    }
    state.editingId = null;
  } else {
    state.events.unshift({
      id: "ev_" + Date.now().toString(36),
      name, category, date, time, location, remindBefore, phone, priority, note,
      done: false, notified: false
    });
  }

  saveEvents();
  render();
  showToast(`✅ Event '<b>${name}</b>' saved successfully!`);
}

function deleteEvent(id) {
  if (!confirm("Are you sure you want to delete this event?")) return;
  state.events = state.events.filter(e => e.id !== id);
  saveEvents();
  render();
}

function markDone(id) {
  const ev = state.events.find(e => e.id === id);
  if (ev) {
    ev.done = true;
    ev.notified = true;
    saveEvents();
    render();
  }
}

function editEvent(id) {
  state.editingId = id;
  render();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

/* ==================== RENDER UI ==================== */
function render() {
  const root = document.getElementById("root");

  // Auth Screen
  if (!state.user) {
    root.innerHTML = `
      <div class="header">
        <div class="brand">
          <span class="logo">🗓️</span>
          <h1>${t("appTitle")}</h1>
        </div>
        <div class="header-actions">
          <select onchange="state.lang=this.value; localStorage.setItem('er_lang', this.value); render();">
            <option value="English" ${state.lang==='English'?'selected':''}>English</option>
            <option value="Hindi" ${state.lang==='Hindi'?'selected':''}>हिंदी</option>
            <option value="Marathi" ${state.lang==='Marathi'?'selected':''}>मराठी</option>
          </select>
          <button class="btn-outline btn-sm" onclick="toggleTheme()">🌓</button>
        </div>
      </div>

      <div class="auth-card">
        <h2 style="margin:0 0 4px;font-size:1.4rem;">🗓️ ${t("appTitle")}</h2>
        <p style="color:var(--text-muted);font-size:0.85rem;margin:0 0 20px;">${t("tagline")}</p>

        <div class="auth-tabs">
          <button class="${state.activeTab==='login'?'active':''}" onclick="state.activeTab='login';render();">${t("login")}</button>
          <button class="${state.activeTab==='register'?'active':''}" onclick="state.activeTab='register';render();">${t("register")}</button>
        </div>

        <form class="auth-form" onsubmit="event.preventDefault(); handleAuth(state.activeTab, this.user.value.trim(), this.pass.value.trim());">
          <div class="field">
            <label>${t("username")}</label>
            <input type="text" name="user" required placeholder="e.g. rohan, om, prince" />
          </div>
          <div class="field">
            <label>${t("password")}</label>
            <input type="password" name="pass" required placeholder="••••••••" />
          </div>
          <button type="submit" class="btn-primary" style="margin-top:10px;padding:10px;">
            ${state.activeTab==='login' ? t("loginBtn") : t("registerBtn")}
          </button>
        </form>
      </div>
    `;
    return;
  }

  // Main Dashboard
  const editingEvent = state.events.find(e => e.id === state.editingId) || null;
  const q = state.search.toLowerCase();
  const filteredEvents = state.events.filter(e => {
    const matchesSearch = !q || e.name.toLowerCase().includes(q) || (e.location && e.location.toLowerCase().includes(q)) || e.date.includes(q);
    const matchesCat = state.filterCategory === "All" || e.category === state.filterCategory;
    const matchesPrio = state.filterPriority === "All" || e.priority === state.filterPriority;
    return matchesSearch && matchesCat && matchesPrio;
  });

  root.innerHTML = `
    <!-- Top Bar -->
    <div class="header">
      <div class="brand">
        <span class="logo">🗓️</span>
        <div>
          <h1>${t("appTitle")}</h1>
          <div style="font-size:0.75rem;color:var(--text-muted);">👤 Logged in as <b>${state.user}</b></div>
        </div>
      </div>
      <div class="header-actions">
        <button class="btn-outline btn-sm" onclick="showOverviewModal()">📋 ${t("overview")}</button>
        <button class="btn-outline btn-sm" onclick="showWeeklyModal()">📊 ${t("weeklyStats")}</button>
        <select onchange="state.lang=this.value; localStorage.setItem('er_lang', this.value); render();">
          <option value="English" ${state.lang==='English'?'selected':''}>English</option>
          <option value="Hindi" ${state.lang==='Hindi'?'selected':''}>हिंदी</option>
          <option value="Marathi" ${state.lang==='Marathi'?'selected':''}>मराठी</option>
        </select>
        <button class="btn-outline btn-sm" onclick="toggleTheme()">🌓</button>
        <button class="btn-danger btn-sm" onclick="state.user=null;localStorage.removeItem('er_user');render();">${t("logout")}</button>
      </div>
    </div>

    <!-- Event Input Card -->
    <div class="card">
      <div class="card-title">${editingEvent ? t("formTitleEdit") : t("formTitleAdd")}</div>
      <form onsubmit="handleSaveEvent(event)">
        <div class="form-grid">
          <div class="field">
            <label>${t("category")}</label>
            <select name="category">
              ${CATEGORIES.map(c => `<option value="${c}" ${editingEvent&&editingEvent.category===c?'selected':''}>${c}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>${t("eventName")}</label>
            <input type="text" name="name" required placeholder="e.g. Baby Shower, Birthday Party" value="${editingEvent?editingEvent.name:''}" />
          </div>
          <div class="field">
            <label>${t("date")}</label>
            <input type="date" name="date" required value="${editingEvent?editingEvent.date:new Date().toISOString().slice(0,10)}" />
          </div>
          <div class="field">
            <label>${t("time")}</label>
            <input type="time" name="time" required value="${editingEvent?editingEvent.time:'18:00'}" />
          </div>
        </div>

        <div class="form-grid">
          <div class="field">
            <label>${t("location")}</label>
            <input type="text" name="location" placeholder="e.g. Grand Celebration Hall, Mumbai" value="${editingEvent?editingEvent.location||'':''}" />
          </div>
          <div class="field">
            <label>${t("remindBefore")}</label>
            <select name="remindBefore">
              ${REMIND_OFFSETS.map(o => `<option value="${o.label}" ${editingEvent&&editingEvent.remindBefore===o.label?'selected':(o.label==='1 hour before'?'selected':'')}>${o.label}</option>`).join("")}
            </select>
          </div>
          <div class="field">
            <label>${t("phone")}</label>
            <input type="tel" name="phone" placeholder="+919876543210" value="${editingEvent?editingEvent.phone||'':''}" />
          </div>
          <div class="field">
            <label>${t("priority")}</label>
            <select name="priority">
              <option value="High" ${editingEvent&&editingEvent.priority==='High'?'selected':''}>🔴 High</option>
              <option value="Medium" ${!editingEvent||editingEvent.priority==='Medium'?'selected':''}>🟡 Medium</option>
              <option value="Low" ${editingEvent&&editingEvent.priority==='Low'?'selected':''}>🟢 Low</option>
            </select>
          </div>
        </div>

        <div class="field" style="margin-bottom:14px;">
          <label>${t("note")}</label>
          <input type="text" name="note" placeholder="Dress code, gift instructions, meeting notes..." value="${editingEvent?editingEvent.note||'':''}" />
        </div>

        <div style="display:flex;gap:8px;">
          <button type="submit" class="btn-primary">${editingEvent ? t("saveBtn") : t("addBtn")}</button>
          ${editingEvent ? `<button type="button" class="btn-outline" onclick="state.editingId=null;render();">${t("clearBtn")}</button>` : ''}
          <button type="button" class="btn-outline" style="margin-left:auto;" onclick="exportCSV()">📥 Export CSV</button>
        </div>
      </form>
    </div>

    <!-- Filter & Search Bar -->
    <div class="filter-bar">
      <input type="search" placeholder="${t("searchPlaceholder")}" value="${state.search}" oninput="state.search=this.value;render();" />
      <select onchange="state.filterCategory=this.value;render();">
        <option value="All">All Categories</option>
        ${CATEGORIES.map(c => `<option value="${c}" ${state.filterCategory===c?'selected':''}>${c}</option>`).join("")}
      </select>
      <select onchange="state.filterPriority=this.value;render();">
        <option value="All">All Priorities</option>
        <option value="High" ${state.filterPriority==='High'?'selected':''}>🔴 High</option>
        <option value="Medium" ${state.filterPriority==='Medium'?'selected':''}>🟡 Medium</option>
        <option value="Low" ${state.filterPriority==='Low'?'selected':''}>🟢 Low</option>
      </select>
    </div>

    <!-- Events List -->
    <div class="events-list">
      ${filteredEvents.length === 0 ? `
        <div style="text-align:center;padding:40px;color:var(--text-muted);">
          <div style="font-size:2rem;margin-bottom:8px;">🎈</div>
          <b>No events found.</b><br>
          Add your first event with the form above!
        </div>
      ` : filteredEvents.map(e => `
        <div class="event-item ${e.done ? 'done' : ''}">
          <div class="event-info">
            <div class="event-title-row">
              <span class="badge badge-cat">${e.category || '📌 General'}</span>
              <span class="event-title">${e.name}</span>
              <span class="badge ${e.priority==='High'?'badge-high':(e.priority==='Low'?'badge-low':'badge-med')}">${e.priority || 'Medium'}</span>
              ${e.remindBefore && e.remindBefore!=='At event time' ? `<span class="badge badge-notice">⏰ ${e.remindBefore}</span>` : ''}
              ${e.done ? `<span class="badge badge-low">✔ Done</span>` : ''}
            </div>
            <div class="event-meta">
              <span>📅 ${e.date} at ${e.time}</span>
              ${e.location ? `<span>📍 ${e.location} <a href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(e.location)}" target="_blank" style="font-weight:600;">[Map]</a></span>` : ''}
              ${e.phone ? `<span>📱 ${e.phone}</span>` : ''}
              ${e.note ? `<span>📝 <i>${e.note}</i></span>` : ''}
            </div>
          </div>
          <div class="event-actions">
            ${!e.done ? `<button class="btn-success btn-sm" onclick="markDone('${e.id}')">✔</button>` : ''}
            <button class="btn-outline btn-sm" onclick="triggerAlert(state.events.find(x=>x.id==='${e.id}'))" title="Test Alert Immediately">🚀</button>
            <button class="btn-outline btn-sm" onclick="editEvent('${e.id}')">✏️</button>
            <button class="btn-danger btn-sm" onclick="deleteEvent('${e.id}')">🗑</button>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function toggleTheme() {
  state.theme = state.theme === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", state.theme);
  localStorage.setItem("er_theme", state.theme);
  render();
}

function exportCSV() {
  if (!state.events.length) return alert("No events to export.");
  let csv = "ID,Name,Category,Date,Time,Location,RemindBefore,Phone,Priority,Note,Done\n";
  state.events.forEach(e => {
    csv += `"${e.id}","${e.name}","${e.category}","${e.date}","${e.time}","${e.location||''}","${e.remindBefore||''}","${e.phone||''}","${e.priority}","${e.note||''}",${e.done}\n`;
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `events_${state.user}.csv`;
  a.click();
}

/* Modals */
function showOverviewModal() {
  const total = state.events.length;
  const completed = state.events.filter(e => e.done).length;
  const pending = total - completed;
  showToast(`
    <b>📋 Event Statistics</b><br>
    Total Events: <b>${total}</b><br>
    Completed: <b style="color:var(--success);">${completed}</b><br>
    Pending: <b style="color:var(--warning);">${pending}</b>
  `, 8000);
}

function showWeeklyModal() {
  showToast(`📊 Activity chart updated in your dashboard.`, 4000);
}

// Request Notification Permission on load
if ('Notification' in window && Notification.permission !== "granted") {
  Notification.requestPermission();
}

loadEvents();
render();
</script>
</body>
</html>
